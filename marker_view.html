<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenArm High-Precision Fiducial Marker Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #101214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            background: #1a1d21;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #2d333b;
        }
        h2 {
            margin-top: 8px;
            color: #58a6ff;
            font-size: 20px;
        }
        p {
            color: #8b949e;
            font-size: 13px;
            line-height: 1.5;
        }
        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .tab-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #238636;
            color: #ffffff;
            border-color: #2ea043;
        }
        .marker-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            display: inline-block;
            margin: 10px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .marker-box img {
            width: 260px;
            height: 260px;
            display: block;
            image-rendering: pixelated;
        }
        .badge {
            background: #238636;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 6px;
        }
        .tips {
            background: #161b22;
            border-left: 4px solid #58a6ff;
            padding: 12px 16px;
            text-align: left;
            border-radius: 4px;
            margin-top: 16px;
            font-size: 12px;
            color: #c9d1d9;
        }
        .tips strong {
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge" id="markerBadge">⭐ 추천: AprilTag 3 (tag36h11 ID:0)</div>
        <h2>스마트폰 손목 마커 디스플레이</h2>
        <p>폰 화면에 이 창을 띄우고 손목/손등에 쥔 채 카메라를 비추세요.</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchMarker('apriltag')">AprilTag 3 (추천·고정밀)</button>
            <button class="tab-btn" onclick="switchMarker('aruco')">ArUco 4x4</button>
        </div>
        
        <div class="marker-box">
            <img id="markerImg" src="apriltag_phone_display.png" alt="Fiducial Marker">
        </div>

        <div class="tips">
            <strong>💡 최고 정밀도 팁:</strong>
            <ul style="margin: 6px 0 0 0; padding-left: 18px;">
                <li><strong>AprilTag 3</strong>는 NASA/ROS 로봇 표준으로 기울어진 각도에서도 지터 없이 칼같이 추종됩니다.</li>
                <li>폰 화면 밝기를 100%로 설정하고 손목에 고정하세요.</li>
            </ul>
        </div>
    </div>

    <script>
        function switchMarker(type) {
            const img = document.getElementById('markerImg');
            const badge = document.getElementById('markerBadge');
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => b.classList.remove('active'));

            if (type === 'apriltag') {
                img.src = 'apriltag_phone_display.png';
                badge.innerText = '⭐ 추천: AprilTag 3 (tag36h11 ID:0)';
                btns[0].classList.add('active');
            } else {
                img.src = 'marker_phone_display.png';
                badge.innerText = 'ArUco (DICT_4X4_50 ID:0)';
                btns[1].classList.add('active');
            }
        }
    </script>
</body>
</html>
