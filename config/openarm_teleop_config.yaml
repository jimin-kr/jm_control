# ==============================================================================
# OpenArm 7-DoF Teleoperation & Kinematics Configuration
# ==============================================================================

openarm_teleop:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. URDF & Frame Specifications
    # --------------------------------------------------------------------------
    urdf_package: "openarm_description"
    urdf_rel_path: "urdf/openarm.urdf"
    base_link_frame: "base_link"
    end_effector_frame: "link7"       # Change to 'hand_tcp' if wrist/tool frame is defined
    elbow_link_frame: "link4"

    # Joint Names matching URDF
    joint_names:
      - "joint1" # Shoulder Yaw
      - "joint2" # Shoulder Pitch
      - "joint3" # Shoulder Roll
      - "joint4" # Elbow Pitch
      - "joint5" # Wrist Roll
      - "joint6" # Wrist Pitch
      - "joint7" # Wrist Yaw

    # Joint Limits (deg)
    joint_limits:
      joint1: [-80.0, 200.0]
      joint2: [-100.0, 100.0]
      joint3: [-90.0, 90.0]
      joint4: [0.0, 140.0]
      joint5: [-90.0, 90.0]
      joint6: [-45.0, 45.0]
      joint7: [-90.0, 90.0]

    # --------------------------------------------------------------------------
    # 2. Vision & RealSense Settings
    # --------------------------------------------------------------------------
    realsense:
      width: 640
      height: 480
      fps: 30
      enable_depth: true

    mediapipe:
      min_detection_confidence: 0.7
      min_tracking_confidence: 0.7
      model_complexity: 1

    # --------------------------------------------------------------------------
    # 3. Filtering & Smoothing Parameters (LPF & Singularity Avoidance)
    # --------------------------------------------------------------------------
    filtering:
      lpf_alpha: 0.35              # Low-Pass Filter alpha (0.0 = frozen, 1.0 = raw)
      moving_average_window: 5     # Window size for moving average
      max_joint_velocity_deg_s: 200.0 # Velocity clamping (deg/sec)
      damp_factor: 0.02            # Damped Least Squares (DLS) IK damping lambda
      singularity_threshold: 0.01  # Minimum manipulability measure

    # --------------------------------------------------------------------------
    # 4. MoveIt2 Servo Integration
    # --------------------------------------------------------------------------
    moveit_servo:
      publish_period: 0.02         # 50 Hz
      command_out_type: "joint_states" # "joint_states" or "trajectory_msgs/JointTrajectory"
      incoming_command_topic: "/servo_node/pose_target"
      status_topic: "/servo_node/status"
